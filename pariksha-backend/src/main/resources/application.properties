# Application
spring.application.name=pariksha-backend

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/pariksha_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# Spring Security
spring.security.user.name=admin
spring.security.user.password=

# Actuator
management.endpoints.web.exposure.include=health,info

# JWT
application.jwt.secret=
application.jwt.expiration=86400000

# Upload
application.upload.path=uploads/photos

# Gemini AI
application.gemini.api-key=
